<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Pathwise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav-brand">Pathwise</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Log in</a>
    </div>
</nav>

<div class="auth-wrap">

    <div class="auth-panel">
        <h2>Start something new.</h2>
        <p>Create an account to explore courses as a student, or start teaching as an instructor.</p>
    </div>

    <div class="auth-form-side">
        <form class="auth-form" id="registerForm">
            <h1>Create your account</h1>
            <p class="sub">It takes less than a minute.</p>

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>

            <div class="field">
                <label>I am joining as a</label>
                <div class="role-toggle">
                    <label class="role-option selected" id="studentOption">
                        <input type="radio" name="role" value="STUDENT" checked>
                        Student
                    </label>
                    <label class="role-option" id="instructorOption">
                        <input type="radio" name="role" value="INSTRUCTOR">
                        Instructor
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Create account</button>
            <p class="form-error" id="registerError">Something went wrong. Please try again.</p>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </div>

</div>

<script>
    // Keep the role toggle's selected state in sync visually
    const studentOption = document.getElementById('studentOption');
    const instructorOption = document.getElementById('instructorOption');
    document.querySelectorAll('input[name="role"]').forEach(input => {
        input.addEventListener('change', () => {
            studentOption.classList.toggle('selected', input.value === 'STUDENT' && input.checked);
            instructorOption.classList.toggle('selected', input.value === 'INSTRUCTOR' && input.checked);
        });
    });

    // Submit handler — points at the register endpoint once it exists.
    // Adjust the URL below to match whatever you build the controller at.
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('registerError');
        errorEl.style.display = 'none';

        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.querySelector('input[name="role"]:checked').value
        };

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                throw new Error('Registration failed');
            }

            window.location.href = 'login.html';
        } catch (err) {
            errorEl.textContent = 'Could not create your account. Please check your details and try again.';
            errorEl.style.display = 'block';
        }
    });
</script>

</body>
</html>
